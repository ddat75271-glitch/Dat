<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nguyễn Thành Đạt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #d4e9d6;
            font-family: 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .fog-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle at 30% 40%, rgba(200, 235, 200, 0.25) 0%, transparent 60%),
                        radial-gradient(circle at 70% 80%, rgba(180, 230, 180, 0.2) 0%, transparent 50%),
                        radial-gradient(circle at 10% 80%, rgba(210, 240, 210, 0.15) 0%, transparent 40%);
            filter: blur(8px);
            animation: fogPulse 12s ease-in-out infinite alternate;
        }

        @keyframes fogPulse {
            0% { opacity: 0.4; transform: scale(1) rotate(0deg); }
            50% { opacity: 0.9; transform: scale(1.05) rotate(2deg); }
            100% { opacity: 0.5; transform: scale(0.95) rotate(-2deg); }
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background: repeating-radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.03) 0px, transparent 80px),
                        repeating-radial-gradient(circle at 80% 70%, rgba(200, 240, 200, 0.04) 0px, transparent 100px);
            filter: blur(20px);
            animation: smokeDrift 18s linear infinite alternate;
            pointer-events: none;
        }

        @keyframes smokeDrift {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 0.3; }
            50% { transform: translate(30px, -20px) scale(1.2) rotate(5deg); opacity: 0.7; }
            100% { transform: translate(-20px, 30px) scale(0.9) rotate(-5deg); opacity: 0.4; }
        }

        .card {
            position: relative;
            z-index: 2;
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(80, 120, 80, 0.15);
            padding: 30px 25px 35px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Header: tên bên trái - avatar bên phải */
        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .profile-left {
            flex: 1;
        }

        .profile-left .name {
            font-size: 2rem;
            font-weight: 700;
            color: #1f4f2b;
            text-shadow: 0 4px 12px rgba(160, 210, 160, 0.4);
            line-height: 1.2;
        }

        /* Avatar bên phải - chữ ĐẠT */
        .avatar-wrapper {
            position: relative;
            flex-shrink: 0;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #b8d9ba, #8fc98a);
            border: 3px solid rgba(255, 255, 255, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: #1f4f2b;
            text-shadow: 0 4px 12px rgba(60, 120, 60, 0.3);
            box-shadow: 0 8px 25px rgba(60, 120, 60, 0.2);
            position: relative;
            z-index: 2;
        }

        /* Vòng tròn xoay quanh avatar */
        .avatar-ring {
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            z-index: 1;
        }

        .avatar-ring .dot {
            position: absolute;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle at 30% 30%, #d4f0d0, #7abf72);
            border-radius: 50%;
            box-shadow: 0 0 15px #a8d8a0;
            top: 50%;
            left: 50%;
            margin-left: -7px;
            margin-top: -7px;
            animation: spinDot 7s linear infinite;
            border: 1px solid rgba(255, 255, 240, 0.7);
        }

        .avatar-ring .dot:nth-child(2) {
            width: 10px;
            height: 10px;
            margin-left: -5px;
            margin-top: -5px;
            background: radial-gradient(circle at 30% 30%, #f0fae8, #9ad092);
            animation: spinDotReverse 9s linear infinite;
        }

        .avatar-ring .dot:nth-child(3) {
            width: 8px;
            height: 8px;
            margin-left: -4px;
            margin-top: -4px;
            background: radial-gradient(circle at 30% 30%, #e4f8dc, #6db064);
            animation: spinDotInner 5s linear infinite;
        }

        @keyframes spinDot {
            0% { transform: rotate(0deg) translateX(65px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(65px) rotate(-360deg); }
        }

        @keyframes spinDotReverse {
            0% { transform: rotate(0deg) translateX(52px) rotate(0deg); }
            100% { transform: rotate(-360deg) translateX(52px) rotate(360deg); }
        }

        @keyframes spinDotInner {
            0% { transform: rotate(0deg) translateX(38px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(38px) rotate(-360deg); }
        }

        /* Social links - kéo xuống dưới */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 25px;
            margin-bottom: 5px;
        }

        .social-links a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            padding: 10px 22px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            color: #1f4f2b;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.2s;
            box-shadow: 0 2px 10px rgba(60, 100, 60, 0.08);
        }

        .social-links a:hover {
            background: rgba(255, 255, 255, 0.7);
            transform: scale(1.05);
        }

        .social-links a i {
            font-size: 1.2rem;
        }

        .social-links a .fa-facebook { color: #1877f2; }
        .social-links a .fa-tiktok { color: #000; }
        .social-links a .fa-phone-alt { color: #25d366; }

        /* Bụi li ti - bay khắp trang */
        .dust-layer {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .dust-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, rgba(255, 255, 240, 0.9) 0%, rgba(200, 230, 180, 0.3) 100%);
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(255, 255, 220, 0.6);
            animation: dustFloat 8s ease-in-out infinite alternate;
            opacity: 0.6;
        }

        @keyframes dustFloat {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            100% { transform: translate(var(--tx, 40px), var(--ty, -30px)) scale(1.8); opacity: 1; }
        }

        @media (max-width: 520px) {
            .card { padding: 20px 15px; }
            .profile-left .name { font-size: 1.5rem; }
            .avatar { width: 75px; height: 75px; font-size: 1.8rem; }
            .social-links a { padding: 8px 16px; font-size: 0.8rem; gap: 6px; }
            .social-links { gap: 10px; }
            
            @keyframes spinDot {
                0% { transform: rotate(0deg) translateX(52px) rotate(0deg); }
                100% { transform: rotate(360deg) translateX(52px) rotate(-360deg); }
            }
            @keyframes spinDotReverse {
                0% { transform: rotate(0deg) translateX(42px) rotate(0deg); }
                100% { transform: rotate(-360deg) translateX(42px) rotate(360deg); }
            }
            @keyframes spinDotInner {
                0% { transform: rotate(0deg) translateX(30px) rotate(0deg); }
                100% { transform: rotate(360deg) translateX(30px) rotate(-360deg); }
            }
        }

        @media (max-width: 400px) {
            .social-links { gap: 8px; }
            .social-links a { padding: 6px 12px; font-size: 0.7rem; gap: 4px; }
            .profile-left .name { font-size: 1.2rem; }
            .avatar { width: 65px; height: 65px; font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="fog-overlay"></div>

    <!-- Bụi li ti bay khắp trang -->
    <div class="dust-layer" id="dustLayer"></div>

    <div class="card">
        <!-- Header: tên bên trái - avatar bên phải -->
        <div class="profile-header">
            <div class="profile-left">
                <div class="name">Nguyễn Thành Đạt</div>
            </div>
            <div class="avatar-wrapper">
                <div class="avatar">ĐẠT</div>
                <div class="avatar-ring">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
        </div>

        <!-- Social links - kéo xuống dưới -->
        <div class="social-links">
            <a href="https://www.facebook.com/share/1E7dzKMYPJ/" target="_blank">
                <i class="fab fa-facebook"></i> Facebook
            </a>
            <a href="https://www.tiktok.com/@nguyendat8752" target="_blank">
                <i class="fab fa-tiktok"></i> TikTok
            </a>
            <a href="tel:+84798514321">
                <i class="fas fa-phone-alt"></i> 0798514321
            </a>
        </div>
    </div>

    <script>
        (function() {
            const dustLayer = document.getElementById('dustLayer');
            if (dustLayer) {
                for (let i = 0; i < 100; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'dust-particle';
                    const size = 2 + Math.random() * 6;
                    const x = Math.random() * 100;
                    const y = Math.random() * 100;
                    const duration = 6 + Math.random() * 12;
                    const delay = Math.random() * 10;
                    const tx = (Math.random() - 0.5) * 120;
                    const ty = (Math.random() - 0.5) * 120;
                    particle.style.cssText = `
                        width:${size}px; height:${size}px;
                        left:${x}%; top:${y}%;
                        --tx:${tx}px; --ty:${ty}px;
                        animation-duration:${duration}s;
                        animation-delay:${delay}s;
                        opacity:${0.3 + Math.random() * 0.7};
                    `;
                    dustLayer.appendChild(particle);
                }
            }
        })();
    </script>
</body>
  </html>
